<html>
  <head>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main">
      <div class="hero">
        <h1 class="title">Metric/Imperial Unit Converter</h1>
        <input id="input" type="number" placeholder="0" />
        <button id="convert-btn">Convert</button>
      </div>
      <div class="conversions">
        <div class="box">
          <h2>Length (meter/ feet)</h2>
          <div class="sided">
            <p id="length">0 meters = 0.000 feet | 0 feet = 0.000 meters</p>
          </div>
        </div>
        <div class="box">
          <h2>Volume (liters/ Gallons)</h2>
          <div class="sided">
            <p id="volume">
              0 liters = 0.000 gallons | 0 gallons = 0.000 liters
            </p>
          </div>
        </div>
        <div class="box">
          <h2>Mass (Kilograms/Pounds)</h2>
          <div class="sided">
            <p id="mass">0 kilos = 0.000 pounds | 0 pounds = 0.000 liters</p>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
